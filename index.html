    <script>
      // Suppress benign Vite HMR WebSocket connection failure in AI Studio preview iframe
      window.addEventListener('error', function (e) {
        if (e && (e.filename?.includes('@vite/client') || e.message?.includes('WebSocket') || e.message?.includes('@vite/client'))) {
          e.preventDefault?.();
          e.stopImmediatePropagation?.();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('@vite/client'))) {
          e.preventDefault?.();
        }
      });
    </script>
